name: Datalogix
description: Datalogix was a consumer-purchase and marketing data company that connected offline buying behavior
  to digital advertising audiences, enabling measurement and targeting for brands and ad platforms. Backed by General
  Catalyst and IVP, it was acquired by Oracle in 2014 and folded into the Oracle Data Cloud. The datalogix.com domain
  now 301-redirects to Oracle's acquisitions page, and no standalone Datalogix developer portal, API, or documentation
  remains publicly available.
